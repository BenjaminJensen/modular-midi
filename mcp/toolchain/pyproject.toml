[project]
name = "toolchain"
version = "0.1.0"
description = "MCP server wrapping the Docker build/test/lint workflow"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires Docker; builds the real fixture projects through the toolchain image",
]
